syntax = "proto3";

service OrderService {
  rpc GetOrderById (OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  string orderId = 1;
}

message OrderItem {
  string sku = 1;
  string name = 2;
  int32 quantity = 3;
}

message OrderResponse {
  string orderId = 1;
  string userId = 2;
  string status = 3;
  string customerEmail = 4;
  repeated OrderItem items = 5;
}
